<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Điều Khiển Nhạc Nổi</title>
    <!-- Tải Font Awesome cho các icon Play/Pause -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #ff3366; /* Màu chủ đạo: Hồng tươi */
            --secondary-color: #333333; /* Màu phụ: Đen */
            --transition-speed: 0.3s;
        }

        body {
            height: 200vh; /* Tạo chiều cao giả để cuộn và kiểm tra vị trí cố định */
            margin: 0;
            background-color: #f4f7f6;
            font-family: 'Inter', sans-serif;
        }

        /* 1. Vị trí cố định (CONTAINER) */
        .floating-music-player {
            position: fixed; /* Giữ cố định trên màn hình dù trang có cuộn */
            bottom: 30px; /* Cách đáy 30px */
            right: 30px; /* Cách lề phải 30px */
            z-index: 1000; /* Đảm bảo nó luôn nằm trên các nội dung khác */
            display: flex;
            align-items: center;
            /* Thiết lập kích thước ban đầu và chuyển động mượt mà */
            width: 50px; /* Kích thước ban đầu (ẩn) */
            height: 50px; /* Kích thước ban đầu (ẩn) */
            background-color: var(--secondary-color);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            overflow: hidden; /* Quan trọng: ẩn phần nội dung bị tràn ra */
            transition: width var(--transition-speed) ease-in-out, 
                        height var(--transition-speed) ease-in-out,
                        background-color var(--transition-speed);
        }

        /* 2. Hiệu ứng khi HOVER */
        .floating-music-player:hover {
            width: 200px; /* Chiều rộng mở rộng */
            height: 50px; 
            background-color: var(--secondary-color);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        /* 3. Icon hiển thị ban đầu (Luôn thấy) */
        .initial-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px; /* Kích thước bằng với kích thước ban đầu của container */
            height: 50px;
            color: white;
            font-size: 20px;
            position: absolute; /* Đặt icon cố định */
            left: 0;
            transition: opacity var(--transition-speed);
        }

        /* Ẩn icon ban đầu khi hover để thấy các control */
        .floating-music-player:hover .initial-icon {
            opacity: 0;
        }

        /* 4. Bảng điều khiển (Chỉ thấy khi hover) */
        .control-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 200px; /* Chiều rộng bằng chiều rộng khi hover */
            height: 50px;
            padding: 0 10px;
            opacity: 0; /* Ban đầu ẩn */
            transform: translateX(50px); /* Dịch chuyển sang phải 1 khoảng bằng chiều rộng ban đầu */
            transition: opacity var(--transition-speed) var(--transition-speed), 
                        transform var(--transition-speed); /* Delay opacity để chuyển động mượt hơn */
        }
        
        /* Hiển thị bảng điều khiển khi hover */
        .floating-music-player:hover .control-panel {
            opacity: 1; /* Hiển thị */
            transform: translateX(0); /* Đưa về vị trí ban đầu */
        }

        /* 5. Nút Play/Pause */
        .toggle-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
            transition: background-color 0.2s, transform 0.2s;
        }

        .toggle-btn:hover {
            background-color: #ff5e84;
            transform: scale(1.05);
        }

        .toggle-btn:active {
            transform: scale(0.95);
        }
        
        /* Hiển thị thông tin (giả định) */
        .track-title {
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap; /* Ngăn tiêu đề bị xuống dòng */
            overflow: hidden;
            text-overflow: ellipsis; /* Thêm dấu ba chấm nếu quá dài */
            margin-right: 10px;
            width: 100px; /* Giới hạn chiều rộng tiêu đề */
        }

        /* Icon đĩa nhạc */
        .fa-compact-disc {
            color: var(--primary-color);
            animation: spin 3s linear infinite; /* Hiệu ứng quay */
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Nội dung giả định để có thể cuộn -->
    <main style="padding: 100px; text-align: center;">
        <h1 style="color: var(--secondary-color);">Trang Chủ (Home)</h1>
        <p style="color: var(--secondary-color);">Hãy cuộn xuống để xem nút điều khiển nhạc luôn cố định ở góc dưới bên phải.</p>
        <div style="height: 1000px; background-color: #e9e9e9; border-radius: 12px; padding: 20px;">
            <p>Nội dung trang...</p>
        </div>
    </main>

    <!-- NÚT ĐIỀU KHIỂN NHẠC NỔI -->
    <div class="floating-music-player">
        <!-- Phần hiển thị ban đầu (luôn thấy) -->
        <div class="initial-icon">
             <!-- Icon đĩa nhạc đang quay -->
            <i class="fas fa-compact-disc"></i>
        </div>
        
        <!-- Bảng điều khiển (chỉ thấy khi hover) -->
        <div class="control-panel">
            <!-- Tên bài hát giả định -->
            <span class="track-title">🎵 Tên Bài Hát Đang Phát...</span>
            
            <!-- Nút Tắt/Bật Nhạc (Toggle Button) -->
            <button class="toggle-btn" id="playPauseBtn" aria-label="Tắt/Bật Nhạc">
                <!-- Giả định ban đầu là đang phát, nên icon là Pause -->
                <i class="fas fa-pause"></i> 
            </button>
        </div>
    </div>

</body>
</html>
